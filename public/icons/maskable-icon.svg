  <line x1="256" y1="252" x2="256" y2="270" stroke="#041427" stroke-width="6" stroke-linecap="round" />
  <line x1="238" y1="270" x2="274" y2="270" stroke="#041427" stroke-width="6" stroke-linecap="round" />

